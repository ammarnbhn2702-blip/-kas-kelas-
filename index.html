<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Kas Batch 8</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--sub:#94a3b8;--green:#22c55e;--red:#ef4444;--blue:#3b82f6}
*{margin:0;box-sizing:border-box;font-family:system-ui,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--txt);padding:16px;max-width:900px;margin:auto}
h1{font-size:1.3rem}.sub{color:var(--sub);font-size:.85rem;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:14px}
.card small{color:var(--sub)}.card .val{font-size:1.2rem;font-weight:700;margin-top:4px}
.green{color:var(--green)}.red{color:var(--red)}
canvas{background:var(--card);border-radius:14px;margin-top:14px;padding:10px}
.bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.b1{background:var(--blue);color:#fff}.b2{background:var(--card);color:var(--txt)}
.b3{background:#7f1d1d;color:#fff;display:none}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;margin-top:6px}
th,td{padding:10px;text-align:left;font-size:.85rem;border-bottom:1px solid #334155}
th{color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--card);padding:20px;border-radius:16px;width:300px;display:grid;gap:10px}
input,select{padding:10px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:var(--txt);width:100%}
@media print{body *{visibility:hidden}#printarea,#printarea *{visibility:visible}#printarea{position:absolute;top:0;color:#000}}
</style>
</head>
<body>
<div id="printarea">
  <h1>Laporan Kas Kelas — Batch 8</h1>
  <p class="sub">Diperbarui otomatis setiap ada transaksi baru • <span id="updated"></span></p>
  <div class="cards">
    <div class="card"><small>Saldo Sekarang</small><div class="val" id="saldo">–</div></div>
    <div class="card"><small>Total Masuk</small><div class="val green" id="masuk">–</div></div>
    <div class="card"><small>Total Keluar</small><div class="val red" id="keluar">–</div></div>
  </div>
  <table>
    <thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th style="text-align:right">Jumlah</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div class="bar">
  <button class="b1" onclick="askPin()">✍️ Mode Bendahara</button>
  <button class="b2" onclick="exportCsv()">⬇️ Excel/CSV</button>
  <button class="b2" onclick="window.print()">🖨️ Cetak/PDF</button>
  <button class="b3" id="btnOut" onclick="logout()">Keluar mode</button>
</div>
<canvas id="chart" height="180"></canvas>

<div class="modal" id="pinModal"><div class="box">
  <b>Masukkan PIN Bendahara</b>
  <input type="password" id="pinInput" inputmode="numeric" maxlength="8" placeholder="PIN">
  <button class="b1" onclick="tryPin()">Buka</button>
  <button class="b2" onclick="closeAll()">Batal</button>
</div></div>

<div class="modal" id="formModal"><div class="box">
  <b>Tambah Transaksi</b>
  <select id="fType"><option value="masuk">💵 Uang Masuk</option><option value="keluar">💸 Uang Keluar</option></select>
  <input id="fAmount" type="number" inputmode="numeric" placeholder="Jumlah (Rp)">
  <input id="fCat" placeholder="Kategori (ikan, sosial, konsumsi…)">
  <input id="fNote" placeholder="Keterangan">
  <button class="b1" onclick="saveTx()">Simpan</button>
  <button class="b2" onclick="closeAll()">Tutup</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const rp=n=>'Rp '+(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
let data=[],mode=false,chart;

async function load(){
  const r=await fetch('/api/data');
  data=await r.json();
  if(!Array.isArray(data))data=[];
  render();
}
function render(){
  const m=data.filter(t=>t.type==='masuk').reduce((a,t)=>a+t.amount,0);
  const k=data.filter(t=>t.type==='keluar').reduce((a,t)=>a+t.amount,0);
  $('saldo').textContent=rp(m-k);$('masuk').textContent=rp(m);$('keluar').textContent=rp(k);
  $('updated').textContent=new Date().toLocaleString('id-ID');
  $('rows').innerHTML=data.slice(0,50).map(t=>`<tr>
    <td>${esc(t.date)}</td>
    <td>${esc(t.note||'-')}${mode&&t._id?` <a href="#" onclick="voidTx('${t._id}');return false" style="color:#ef4444">✕</a>`:''}</td>
    <td>${esc(t.category)}</td>
    <td style="text-align:right" class="${t.type==='masuk'?'green':'red'}">${t.type==='masuk'?'+':'−'}${rp(t.amount)}</td>
  </tr>`).join('');
  drawChart();
}
function drawChart(){
  const mo={};data.forEach(t=>{const k=(t.date||'').slice(0,7);if(!k)return;mo[k]=mo[k]||{masuk:0,keluar:0};mo[k][t.type]+=t.amount});
  const keys=Object.keys(mo).sort().slice(-6);
  if(chart)chart.destroy();
  chart=new Chart($('chart'),{type:'bar',data:{labels:keys,datasets:[
    {label:'Masuk',data:keys.map(x=>mo[x].masuk),backgroundColor:'#22c55e'},
    {label:'Keluar',data:keys.map(x=>mo[x].keluar),backgroundColor:'#ef4444'}]},
    options:{plugins:{legend:{labels:{color:'#e2e8f0'}}},scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'}}}}});
}
function askPin(){$('pinModal').classList.add('open');$('pinInput').focus()}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))}
function tryPin(){
  fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json','x-pin':$('pinInput').value},body:'{"check":true}'})
  .then(r=>{if(r.ok){localStorage.setItem('kas_pin',$('pinInput').value);mode=true;closeAll();$('btnOut').style.display='';render();openForm()}else alert('PIN salah')});
}
function logout(){mode=false;localStorage.removeItem('kas_pin');$('btnOut').style.display='none';render()}
function openForm(){$('formModal').classList.add('open')}
async function saveTx(){
  const b={type:$('fType').value,amount:Number($('fAmount').value),category:$('fCat').value,note:$('fNote').value};
  if(!b.amount||b.amount<=0)return alert('Isi jumlahnya dulu');
  const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json','x-pin':localStorage.getItem('kas_pin')},body:JSON.stringify(b)});
  if(r.ok){closeAll();$('fAmount').value='';$('fNote').value='';load()}else alert('Gagal simpan — cek PIN/koneksi');
}
async function voidTx(id){
  if(!confirm('Batalkan transaksi ini?'))return;
  await fetch('/api/data?id='+id,{method:'DELETE',headers:{'x-pin':localStorage.getItem('kas_pin')}});
  load();
}
function exportCsv(){
  const rows=[['Tanggal','Jenis','Kategori','Keterangan','Jumlah']];
  data.forEach(t=>rows.push([t.date,t.type,t.category,t.note,t.amount]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download='kas-batch8.csv';a.click();
}
if(localStorage.getItem('kas_pin')){mode=true;$('btnOut').style.display=''}
load();
</script>
</body>
</html>
